<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瞬鲜达 - 管理员登录</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        
        .admin-login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .admin-login-header h2 {
            color: #2196F3;
            margin-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .form-group input:focus {
            border-color: #2196F3;
            outline: none;
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #1976D2;
        }
        
        .switch-form {
            text-align: center;
            margin-top: 20px;
        }
        
        .switch-form a {
            color: #2196F3;
            text-decoration: none;
        }
        
        .switch-form a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            color: #f44336;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="admin-login-container">
        <div class="admin-login-header">
            <h2>瞬鲜达生鲜平台</h2>
            <p>管理员登录</p>
        </div>
        
        <div class="error-message" id="error-message"></div>
        
        <form id="admin-login-form">
            <div class="form-group">
                <label for="username">管理员用户名</label>
                <input type="text" id="username" name="username" value="admin" required>
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" value="123456" required>
            </div>
            
            <button type="submit" class="btn">管理员登录</button>
            
            <div class="switch-form">
                <p>普通用户登录？<a href="login.html">用户入口</a></p>
            </div>
        </form>
    </div>

    <script src="scripts/api-simple.js"></script>
    <script>
        document.getElementById('admin-login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            console.log('=== 管理员登录尝试 ===');
            console.log('登录凭据:', { username, password: '***' });
            
            try {
                // 使用简化版API客户端
                const response = await simpleApiClient.login(username, password);
                
                console.log('收到登录响应:', JSON.stringify(response));
                
                // 清除之前的错误消息
                const errorMessage = document.getElementById('error-message');
                errorMessage.style.display = 'none';
                
                if (response.success) {
                    console.log('登录响应成功');
                    
                    if (response.user) {
                        console.log('用户信息存在:', {
                            id: response.user.id,
                            username: response.user.username,
                            role: response.user.role
                        });
                        
                        // 存储用户信息
                        localStorage.setItem('user', JSON.stringify(response.user));
                        console.log('已存储用户信息到localStorage');
                        
                        if (response.user.role === 'admin') {
                            console.log('确认是管理员，准备跳转...');
                            window.location.href = 'admin.html';
                        } else {
                            console.log('非管理员角色');
                            errorMessage.textContent = '该账户不是管理员账户';
                            errorMessage.style.display = 'block';
                        }
                    } else {
                        console.log('响应中没有用户信息');
                        errorMessage.textContent = '登录成功但未返回用户信息';
                        errorMessage.style.display = 'block';
                    }
                } else {
                    console.log('登录响应失败:', response.message);
                    errorMessage.textContent = response.message || '管理员用户名或密码错误';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('登录过程中出现异常:', error);
                console.error('异常名称:', error.name);
                console.error('异常堆栈:', error.stack);
                const errorMessage = document.getElementById('error-message');
                errorMessage.textContent = '网络请求失败: ' + error.message;
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
