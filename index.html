        <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瞬鲜达生鲜平台</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-logo">瞬鲜达</h1>
            <ul class="nav-menu">
                <li class="nav-item"><a href="#home" class="nav-link" data-module="home">首页</a></li>
                <li class="nav-item"><a href="#special-offers" class="nav-link" data-module="specialOffers">今日特价</a></li>
                <li class="nav-item"><a href="#fresh-produce" class="nav-link" data-module="freshProduce">新鲜果蔬</a></li>
                <li class="nav-item"><a href="#meat-poultry" class="nav-link" data-module="meatPoultry">肉禽蛋品</a></li>
                <li class="nav-item"><a href="#seafood" class="nav-link" data-module="seafood">水产海鲜</a></li>
                <li class="nav-item"><a href="#dairy-bakery" class="nav-link" data-module="dairyBakery">乳品面点</a></li>
                <li class="nav-item"><a href="#bean-products" class="nav-link" data-module="beanProducts">豆制品/杂粮</a></li>
                <li class="nav-item"><a href="#ready-meals" class="nav-link" data-module="readyMeals">速食净菜</a></li>
                <li class="nav-item"><a href="#direct-sourcing" class="nav-link" data-module="directSourcing">产地直采</a></li>
                <li class="nav-item"><a href="#after-sales" class="nav-link" data-module="afterSales">无忧售后</a></li>
            </ul>
            <div class="user-actions">
                <div class="task-center" id="task-center" style="display: none;">
                    <span class="task-center-label">任务中心 ▼</span>
                    <div class="task-dropdown">
                        <a href="#" id="edit-nickname">修改昵称</a>
                        <a href="#" id="change-password">修改密码</a>
                        <a href="#" id="logout-link">退出</a>
                    </div>
                </div>
                <span id="user-info"></span>
                <a href="login.html" id="personal-center">个人中心</a>
            </div>
        </div>
    </nav>

    <!-- 主要内容区域 -->
    <main id="main-content">
        <!-- 首页模块 -->
        <section id="home" class="module active">
            <div class="carousel-container">
                <div class="carousel">
                    <div class="carousel-slide active">
                        <img src="src/shengxian.png" alt="新鲜蔬菜到货">
                        <div class="carousel-caption">
                            <h3>今日新鲜蔬菜</h3>
                            <p>从农场直达餐桌</p>
                        </div>
                    </div>
                    <div class="carousel-slide">
                        <img src="src/fruit.png" alt="时令水果">
                        <div class="carousel-caption">
                            <h3>时令水果</h3>
                            <p>新鲜多汁，营养丰富</p>
                        </div>
                    </div>
                    <div class="carousel-slide">
                        <img src="src/youji.jpg" alt="有机食品">
                        <div class="carousel-caption">
                            <h3>有机认证</h3>
                            <p>健康生活从这里开始</p>
                        </div>
                    </div>
                </div>
                <button class="carousel-btn prev-btn">&lt;</button>
                <button class="carousel-btn next-btn">&gt;</button>
                <div class="carousel-indicators">
                    <span class="indicator active" data-slide="0"></span>
                    <span class="indicator" data-slide="1"></span>
                    <span class="indicator" data-slide="2"></span>
                </div>
            </div>
            

        </section>

        <!-- 其他模块将通过JavaScript动态加载 -->
        <section id="special-offers" class="module"></section>
        <section id="fresh-produce" class="module"></section>
        <section id="meat-poultry" class="module"></section>
        <section id="seafood" class="module"></section>
        <section id="dairy-bakery" class="module"></section>
        <section id="bean-products" class="module"></section>
        <section id="ready-meals" class="module"></section>
        <section id="direct-sourcing" class="module"></section>
        <section id="after-sales" class="module"></section>
    </main>

    <!-- 购物车图标 (始终显示在右下角) -->
    <div class="cart-icon">
        <img src="src/cart.png" alt="购物车" />
        <span class="cart-count" id="cart-count">0</span>
    </div>

    <script src="scripts/api.js"></script>
    <script src="scripts/main.js"></script>
    <script src="scripts/modules/home.js"></script>
    <script src="scripts/modules/specialOffers.js"></script>
    <script src="scripts/modules/freshProduce.js"></script>
    <script src="scripts/modules/meatPoultry.js"></script>
    <script src="scripts/modules/seafood.js"></script>
    <script src="scripts/modules/dairyBakery.js"></script>
    <script src="scripts/modules/beanProducts.js"></script>
    <script src="scripts/modules/readyMeals.js"></script>
    <script src="scripts/modules/directSourcing.js"></script>
    <script src="scripts/modules/afterSales.js"></script>
</body>
</html>
