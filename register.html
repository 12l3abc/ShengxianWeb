<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瞬鲜达 - 注册</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .register-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        
        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .register-header h2 {
            color: #4CAF50;
            margin-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .form-group input:focus {
            border-color: #4CAF50;
            outline: none;
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #45a049;
        }
        
        .switch-form {
            text-align: center;
            margin-top: 20px;
        }
        
        .switch-form a {
            color: #4CAF50;
            text-decoration: none;
        }
        
        .switch-form a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            color: #f44336;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
        
        .success-message {
            color: #4CAF50;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <h2>瞬鲜达生鲜平台</h2>
            <p>创建新账户</p>
        </div>
        
        <div class="error-message" id="error-message"></div>
        <div class="success-message" id="success-message"></div>
        
        <form id="register-form">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="form-group">
                <label for="confirm-password">确认密码</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
            </div>
            
            <button type="submit" class="btn">注册</button>
            
            <div class="switch-form">
                <p>已有账户？<a href="login.html">立即登录</a></p>
            </div>
        </form>
    </div>

    <script src="scripts/api-simple.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            // 简单验证
            if (password !== confirmPassword) {
                const errorMessage = document.getElementById('error-message');
                errorMessage.textContent = '两次输入的密码不一致';
                errorMessage.style.display = 'block';
                return;
            }
            
            try {
                console.log('=== 用户注册尝试 ===');
                console.log('注册信息:', { username, password: '***' });
                
                // 使用简化版API客户端
                const response = await simpleApiClient.register(username, password);
                
                console.log('注册响应:', response);
                
                if (response.success) {
                    // 注册成功
                    const successMessage = document.getElementById('success-message');
                    successMessage.textContent = '注册成功！即将跳转到登录页面...';
                    successMessage.style.display = 'block';
                    
                    // 保存用户信息到localStorage
                    const userInfo = response.user || { username, role: 'user' };
                    localStorage.setItem('user', JSON.stringify(userInfo));
                    console.log('存储的用户信息:', userInfo);
                    
                    // 3秒后跳转到主页
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 3000);
                } else {
                    // 注册失败
                    const errorMessage = document.getElementById('error-message');
                    errorMessage.textContent = response.message || '注册失败，请重试';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('注册失败:', error);
                console.error('错误名称:', error.name);
                console.error('错误堆栈:', error.stack);
                const errorMessage = document.getElementById('error-message');
                errorMessage.textContent = '网络请求失败: ' + error.message;
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
