<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瞬鲜达 - 水产海鲜</title>
</head>
<body>
    <!-- 海鲜模块主要内容 -->
    <section id="seafood" class="module">
        <div class="module-header">
            <h2>水产海鲜</h2>
            <p>新鲜捕捞，全程冷链，保证鲜活品质</p>
        </div>
        <div class="seafood-grid" id="seafood-grid">
            <!-- 海鲜商品卡片 1 -->
            <div class="product-card seafood-card" data-id="seafood1">
                <div class="product-image">
                    <img src="src/shengxian.png" alt="大闸蟹" onerror="this.onerror=null;this.src='src/shengxian.png'" loading="lazy">
                    <div class="fresh-seafood-badge">鲜活</div>
                </div>
                <div class="product-info">
                    <h4>大闸蟹</h4>
                    <p>精选优质大闸蟹，肉质鲜美</p>
                    <div class="product-meta">
                        <span class="price">¥88.00</span>
                    </div>
                    <button class="add-to-cart-btn">加入购物车</button>
                </div>
            </div>
            
            <!-- 海鲜商品卡片 2 -->
            <div class="product-card seafood-card" data-id="seafood2">
                <div class="product-image">
                    <img src="src/shengxian.png" alt="基围虾" onerror="this.onerror=null;this.src='src/shengxian.png'" loading="lazy">
                    <div class="fresh-seafood-badge">新鲜</div>
                </div>
                <div class="product-info">
                    <h4>基围虾</h4>
                    <p>新鲜基围虾，口感Q弹</p>
                    <div class="product-meta">
                        <span class="price">¥58.00</span>
                    </div>
                    <button class="add-to-cart-btn">加入购物车</button>
                </div>
            </div>
            
            <!-- 海鲜商品卡片 3 -->
            <div class="product-card seafood-card" data-id="seafood3">
                <div class="product-image">
                    <img src="src/shengxian.png" alt="三文鱼" onerror="this.onerror=null;this.src='src/shengxian.png'" loading="lazy">
                    <div class="fresh-seafood-badge">冰鲜</div>
                </div>
                <div class="product-info">
                    <h4>三文鱼</h4>
                    <p>新鲜三文鱼，富含Omega-3</p>
                    <div class="product-meta">
                        <span class="price">¥68.00</span>
                    </div>
                    <button class="add-to-cart-btn">加入购物车</button>
                </div>
            </div>
            
            <!-- 海鲜商品卡片 4 -->
            <div class="product-card seafood-card" data-id="seafood4">
                <div class="product-image">
                    <img src="src/shengxian.png" alt="鲍鱼" onerror="this.onerror=null;this.src='src/shengxian.png'" loading="lazy">
                    <div class="fresh-seafood-badge">鲜活</div>
                </div>
                <div class="product-info">
                    <h4>鲍鱼</h4>
                    <p>优质鲍鱼，营养丰富</p>
                    <div class="product-meta">
                        <span class="price">¥128.00</span>
                    </div>
                    <button class="add-to-cart-btn">加入购物车</button>
                </div>
            </div>
            
            <!-- 海鲜商品卡片 5 -->
            <div class="product-card seafood-card" data-id="seafood5">
                <div class="product-image">
                    <img src="src/shengxian.png" alt="皮皮虾" onerror="this.onerror=null;this.src='src/shengxian.png'" loading="lazy">
                    <div class="fresh-seafood-badge">鲜活</div>
                </div>
                <div class="product-info">
                    <h4>皮皮虾</h4>
                    <p>新鲜皮皮虾，味道鲜美</p>
                    <div class="product-meta">
                        <span class="price">¥48.00</span>
                    </div>
                    <button class="add-to-cart-btn">加入购物车</button>
                </div>
            </div>
            
            <!-- 海鲜商品卡片 6 -->
            <div class="product-card seafood-card" data-id="seafood6">
                <div class="product-image">
                    <img src="src/shengxian.png" alt="扇贝" onerror="this.onerror=null;this.src='src/shengxian.png'" loading="lazy">
                    <div class="fresh-seafood-badge">鲜活</div>
                </div>
                <div class="product-info">
                    <h4>扇贝</h4>
                    <p>新鲜扇贝，口感Q弹</p>
                    <div class="product-meta">
                        <span class="price">¥38.00</span>
                    </div>
                    <button class="add-to-cart-btn">加入购物车</button>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
